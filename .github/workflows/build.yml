name: Build & Release

on:
  push:
    branches: [ main, "refactor/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: BlackHole
  MAIN_CLASS: io.github.laithabuzaid.blackhole.Main
  JLINK_MODULES: java.base,java.management,jdk.management,jdk.unsupported

jobs:
  build-linux:
    name: Build Linux x86_64 (.AppImage, .deb, .jar)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Resolve Maven Version
        run: |
          APP_VERSION="$(python3 -c 'import xml.etree.ElementTree as ET; r=ET.parse("pom.xml").getroot(); print(r.find("{http://maven.apache.org/POM/4.0.0}version").text.strip())')"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "Building BlackHole v${APP_VERSION} for Linux x86_64"

      - name: Build, Test & Package Shaded JAR
        run: mvn -B clean test package -Pnatives-linux

      - name: Build Minimal jlink Runtime & jpackage App Image
        run: |
          mkdir -p build/input dist
          JAR_PATH="$(ls target/blackhole-*.jar | head -n 1)"
          JAR_NAME="$(basename "$JAR_PATH")"
          cp "$JAR_PATH" "build/input/$JAR_NAME"
          cp "$JAR_PATH" "dist/BlackHole-${APP_VERSION}-Linux-x86_64.jar"

          jlink \
            --add-modules "${JLINK_MODULES}" \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --compress=zip-6 \
            --output build/runtime

          jpackage \
            --type app-image \
            --name "${APP_NAME}" \
            --app-version "${APP_VERSION}" \
            --vendor "Laith Abuzaid" \
            --description "Real-Time Relativistic Kerr-Schild Black Hole, Binary Merger, Wormhole & TDE Engine" \
            --input build/input \
            --main-jar "$JAR_NAME" \
            --main-class "${MAIN_CLASS}" \
            --runtime-image build/runtime \
            --icon packaging/icons/blackhole.png \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --dest build/app-image

      - name: Package Portable Linux AppImage
        run: |
          mkdir -p build/AppDir/usr
          cp -a "build/app-image/${APP_NAME}/." build/AppDir/usr/
          cp packaging/icons/blackhole.png build/AppDir/blackhole.png
          ln -sf blackhole.png build/AppDir/.DirIcon

          cat <<'EOF' > build/AppDir/blackhole.desktop
          [Desktop Entry]
          Type=Application
          Name=BlackHole
          Comment=Real-Time Relativistic Black Hole, Binary Merger, Wormhole & TDE Engine
          Exec=BlackHole
          Icon=blackhole
          Categories=Science;Education;Graphics;
          Terminal=false
          EOF

          cat <<'EOF' > build/AppDir/AppRun
          #!/usr/bin/env bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/BlackHole" "$@"
          EOF
          chmod +x build/AppDir/AppRun

          curl -fSL -o appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run \
            build/AppDir "dist/BlackHole-${APP_VERSION}-Linux-x86_64.AppImage"
          chmod +x "dist/BlackHole-${APP_VERSION}-Linux-x86_64.AppImage"

      - name: Package Debian/Ubuntu .deb Installer
        run: |
          jpackage \
            --type deb \
            --app-image "build/app-image/${APP_NAME}" \
            --name "${APP_NAME}" \
            --app-version "${APP_VERSION}" \
            --vendor "Laith Abuzaid" \
            --description "Real-Time Relativistic Kerr-Schild Black Hole, Binary Merger, Wormhole & TDE Engine" \
            --linux-shortcut \
            --linux-menu-group "Science;Education;Graphics" \
            --dest build/deb
          cp build/deb/*.deb "dist/BlackHole-${APP_VERSION}-Linux-x86_64.deb"
          ls -lh dist/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-linux-x86_64
          path: dist/*

  build-windows:
    name: Build Windows x64 (Setup .exe, Portable .zip, .jar)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Resolve Maven Version
        shell: pwsh
        run: |
          $appVer = ([xml](Get-Content pom.xml)).project.version.Trim()
          "APP_VERSION=$appVer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building BlackHole v$appVer for Windows x64"

      - name: Build, Test & Package Shaded JAR
        run: mvn -B clean test package -Pnatives-windows

      - name: Ensure WiX Toolset 3.x is Available for jpackage
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $wixBin) {
            choco install wixtoolset -y --no-progress
            $wixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $wixBin) {
            throw "WiX Toolset 3.x bin directory not found"
          }
          Write-Host "Using WiX Toolset at $($wixBin.FullName)"
          "$($wixBin.FullName)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Minimal jlink Runtime, Portable .zip & Setup .exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/input, dist | Out-Null
          $jar = Get-ChildItem target/blackhole-*.jar | Select-Object -First 1
          Copy-Item $jar.FullName "build/input/$($jar.Name)"
          Copy-Item $jar.FullName "dist/BlackHole-$($env:APP_VERSION)-Windows-x64.jar"

          jlink `
            --add-modules $env:JLINK_MODULES `
            --strip-debug `
            --no-man-pages `
            --no-header-files `
            --compress=zip-6 `
            --output build/runtime

          jpackage `
            --type app-image `
            --name $env:APP_NAME `
            --app-version $env:APP_VERSION `
            --vendor "Laith Abuzaid" `
            --description "Real-Time Relativistic Kerr-Schild Black Hole, Binary Merger, Wormhole & TDE Engine" `
            --input build/input `
            --main-jar $jar.Name `
            --main-class $env:MAIN_CLASS `
            --runtime-image build/runtime `
            --icon packaging/icons/blackhole.ico `
            --java-options "--enable-native-access=ALL-UNNAMED" `
            --dest build/app-image

          Compress-Archive `
            -Path "build/app-image/$($env:APP_NAME)" `
            -DestinationPath "dist/BlackHole-$($env:APP_VERSION)-Windows-x64-Portable.zip" `
            -CompressionLevel Optimal

          jpackage `
            --type exe `
            --app-image "build/app-image/$($env:APP_NAME)" `
            --name $env:APP_NAME `
            --app-version $env:APP_VERSION `
            --vendor "Laith Abuzaid" `
            --description "Real-Time Relativistic Kerr-Schild Black Hole, Binary Merger, Wormhole & TDE Engine" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut `
            --win-per-user-install `
            --dest build/exe

          $exe = Get-ChildItem build/exe/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "dist/BlackHole-$($env:APP_VERSION)-Windows-x64-Setup.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-windows-x64
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [ build-linux, build-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download All Platform Release Assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums & Release Notes
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          VER="$(ls BlackHole-*-Linux-x86_64.AppImage | sed -E 's/BlackHole-(.+)-Linux-x86_64\.AppImage/\1/')"
          echo "REL_VER=${VER}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BlackHole ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## BlackHole ${{ github.ref_name }} — Real-Time General-Relativistic Black Hole Observatory

            **No Java installation required** for native downloads — each package bundles a minimal `jlink` runtime (`java.base`, `java.management`, `jdk.management`, `jdk.unsupported`) and OpenGL 4.3 / OpenAL Soft native libraries (~22–24 MB).

            ### Downloads
            | Platform | Recommended Download | Portable / Alternative |
            |---|---|---|
            | **Windows (x64)** | `BlackHole-${{ env.REL_VER }}-Windows-x64-Setup.exe` *(Installer + Start Menu/Desktop shortcuts)* | `BlackHole-${{ env.REL_VER }}-Windows-x64-Portable.zip` *(Unzip & run `BlackHole.exe`)* |
            | **Linux (x86_64)** | `BlackHole-${{ env.REL_VER }}-Linux-x86_64.AppImage` *(`chmod +x` and run on any distro)* | `BlackHole-${{ env.REL_VER }}-Linux-x86_64.deb` *(Debian / Ubuntu / Pop!_OS / Mint)* |
            | **Java 21+ (Dev)** | `BlackHole-${{ env.REL_VER }}-Windows-x64.jar` / `BlackHole-${{ env.REL_VER }}-Linux-x86_64.jar` | Run with `java --enable-native-access=ALL-UNNAMED -jar <file>.jar` |

            > **System Requirements:** Dedicated or integrated GPU with **OpenGL 4.3 Core** support (Windows 10/11 x64 or Linux x86_64). *(Note: macOS is capped by Apple at OpenGL 4.1 and does not support OpenGL 4.3 Compute Shaders.)*

            ### What's New in ${{ github.ref_name }}
            - **EHT 230 GHz Polarized Magnetic Field & VLBI Radio Mode (`[N]` / `[Shift+N]`):** Real-time Kerr-dragged synchrotron polarization streamlines + authentic Event Horizon Telescope 1.3 mm brightness-temperature colormap.
            - **Projected Astrophysical Reticle & Scale Ruler (`[Q]`):** Live screen-space calibrated gravitational scale bar ($r_g = GM/c^2$), shadow critical curve ($b_c = 5.20M$) & ISCO markers, plus real-time `M1`/`M2` tracking brackets in Binary Merger mode.
            - **Real LIGO Event Presets (Binary Mode):** One-click `GW150914` ($q = 0.81$), `GW190412` ($q = 0.28$), and `EQUAL 1:1` ($q = 1.00$) binary black hole merger presets.
            - **Desktop App Polish:** Instant borderless fullscreen toggle (`[F11]` / `Alt+Enter`), native taskbar window icon (zero `java.desktop`), and persistent user settings (`settings.properties`).
          files: |
            release-assets/*
